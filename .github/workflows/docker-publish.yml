name: Docker Publish

# Publishes only from main and version tags. Feature branches build the app
# in regular CI; publishing per branch just spams the registry and marks
# every PR red when the push fails.
on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/baihakitanjung/hermes3d

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Prepare Docker tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          ref_name="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/_' '-' | tr -cd 'a-z0-9.-')"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tag="${IMAGE_NAME}:main"
          elif [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            tag="${IMAGE_NAME}:${ref_name}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${IMAGE_NAME}:${GITHUB_REF#refs/tags/v}"
          else
            echo "Unsupported ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          echo "value=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
