apiVersion: v1
kind: Namespace
metadata:
  name: hermes3d
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes3d-secret
  namespace: hermes3d
type: Opaque
stringData:
  STUDIO_ACCESS_TOKEN: "ganti-token-login-ui-bebas"
  HERMES_GATEWAY_TOKEN: "ganti-token-gateway-hermes-vps"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes3d-ui
  namespace: hermes3d
  labels:
    app: hermes3d-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes3d-ui
  template:
    metadata:
      labels:
        app: hermes3d-ui
    spec:
      containers:
        - name: hermes3d
          image: ghcr.io/baihakitanjung/hermes-3d:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: STUDIO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes3d-secret
                  key: STUDIO_ACCESS_TOKEN
            # Point gateway URL ke IP VPS host tempat Hermes Agent jalan
            - name: HERMES3D_GATEWAY_URL
              value: "ws://103.77.78.114:9119"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: hermes3d-service
  namespace: hermes3d
spec:
  selector:
    app: hermes3d-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Traefik IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes3d-ingress
  namespace: hermes3d
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hermes.domainkamu.com`)
      kind: Rule
      services:
        - name: hermes3d-service
          port: 3000
  tls:
    secretName: hermes3d-cert-secret
